name: Real-server round-trip benchmarks

# Manual evidence only; noisy shared-runner results do not enforce performance thresholds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roundtrips:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Build and verify correctness
        run: |
          dotnet build ValkeyDotNet.slnx --configuration Release
          dotnet run --no-build --configuration Release --project tests/ValkeyDotNet.Tests
          dotnet run --no-build --configuration Release --project tests/ValkeyDotNet.IntegrationTests -- -class '*TestInfrastructure.*'
          mkdir -p artifacts/performance
          VALKEYDOTNET_RUN_ROUNDTRIP_TESTS=1 dotnet run --no-build --configuration Release --project tests/ValkeyDotNet.IntegrationTests -- \
            -method '*OwnedRoundTripWorkloadsPreserveBinaryDataAndLockOutcomes' \
            -showLiveOutput -result-trx artifacts/performance/roundtrip-workloads.trx
      - name: Record runner environment
        run: |
          dotnet --info > artifacts/performance/dotnet-info.txt
          lscpu > artifacts/performance/cpu-info.txt
      - name: Run bounded 32-row cache and lock profile
        run: dotnet run --no-build --configuration Release --project benchmarks/ValkeyDotNet.Benchmarks -- --roundtrips
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: roundtrip-performance-results
          path: artifacts/performance/
          if-no-files-found: warn
