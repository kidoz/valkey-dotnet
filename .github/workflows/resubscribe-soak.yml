name: Resubscribe soak

# Manual only: each protocol case owns and removes a fresh three-primary cluster.
on:
  workflow_dispatch:
    inputs:
      cycles:
        description: Measured relocations per protocol (20 to 100, plus four warm-up cycles)
        default: "30"
        required: true
        type: string

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      VALKEYDOTNET_RUN_RESUBSCRIBE_SOAK: "1"
      VALKEYDOTNET_RESUBSCRIBE_CYCLES: ${{ inputs.cycles }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Run isolated bounded soak
        run: |
          mkdir -p artifacts/resilience
          dotnet run --project tests/ValkeyDotNet.IntegrationTests --configuration Release -- \
            -method '*OwnedResubscribeSoakPreservesStreamsAndBoundsSettledResources' \
            -showLiveOutput -result-trx artifacts/resilience/resubscribe-soak.trx
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resubscribe-soak-results
          path: artifacts/resilience/resubscribe-soak.trx
          if-no-files-found: warn
